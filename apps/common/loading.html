<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Netfish</title>
    <!--
      What the apps show while they look for the server (a few seconds at most): the fish,
      swimming. Bundled in every app, so it shows at once, with or without a network. Away from
      home, through WireGuard (netfishTunnel below): a ring, the tunnel, breathes ahead of the fish;
      once it's up the ring comes to the centre as the fish swims into it and is gone, leaving only
      the tunnel. The apps then open Netfish with #tunnel, where the opening animation (web Splash)
      takes over the same ring at the same place, size and breath, and the fish comes back out.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #06080b; color: #eef3f6; font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-user-select: none; user-select: none; }
      body { display: grid; place-items: center; -webkit-app-region: drag; }
      /* The fish sits at the very centre of the screen, where the apps draw it while they start. */
      .stage { position: relative; display: grid; }
      .mark { position: relative; width: 96px; height: 96px; transition: transform 0.75s cubic-bezier(0.6, 0, 0.3, 1); }
      .below { position: absolute; top: calc(100% + 18px); left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 18px; white-space: nowrap; }
      svg { display: block; width: 96px; height: 96px; overflow: visible; }
      .swim { animation: bob 2.4s ease-in-out infinite; }
      .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: wag 0.7s ease-in-out infinite alternate; }
      .bubble { fill: none; stroke: #36e2c6; stroke-width: 1.4; opacity: 0; animation: rise 2.4s ease-out infinite; }
      .bubble:nth-of-type(2) { animation-delay: 0.8s; }
      .bubble:nth-of-type(3) { animation-delay: 1.6s; }
      .word { font-size: 26px; letter-spacing: -0.035em; animation: in 0.5s ease-out both; }
      .word .net { font-weight: 300; color: #b5c0ca; }
      .word .fish { font-weight: 800; margin-left: 0.04em; }
      .status { min-height: 1.5em; color: #7c8996; font-size: 14px; opacity: 0; animation: in 0.6s ease-out 1.4s forwards; }
      .tunnel .status, .through .status { color: #36e2c6; opacity: 1; animation: none; }

      /* The tunnel: an oval ring seen from the side (on the 96px fish, 1.5px a unit), in halves:
         the back one (the left) behind the fish, never over it; the front one only where the fish
         is already gone. It breathes all along (the <i>, on the clock, so the opening animation's
         ring breathes in step). Once through it comes to the centre, growing as it comes, and the
         fish is gone past its middle. The opening animation (web/src/styles.css, .splash__ring)
         takes it from there. */
      .ring { position: absolute; left: 100.5px; top: 48px; width: 18px; height: 42px; transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.6s ease; }
      .ring i { position: absolute; inset: 0; box-sizing: border-box; border: 2px solid #36e2c6; border-radius: 50%; }
      .ring.back { clip-path: inset(-30% 50% -30% -30%); }
      .ring.front { clip-path: inset(-30% -30% -30% 50%); }
      .tunnel .ring, .through .ring { opacity: 1; }
      .tunnel .ring i, .through .ring i { animation: breathe 1.6s ease-in-out infinite; }
      .through .ring { animation: come 0.75s cubic-bezier(0.6, 0, 0.3, 1) forwards; }
      /* The fish as far as the ring's middle; past it, it's in the tunnel. */
      .fish-in { position: relative; }
      .through .fish-in { animation: hide 0.75s cubic-bezier(0.6, 0, 0.3, 1) forwards; }
      .through .fish-in svg { animation: swim-in 0.8s cubic-bezier(0.45, 0, 0.7, 0.55) forwards; }
      .through .word { animation: out 0.4s ease forwards; }
      /* The opening animation's glow, ready for it, and its fish's size (--k, set as it connects). */
      .glow { position: fixed; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 48%, #0a1a1c 0%, #06080b 70%); opacity: 0; transition: opacity 0.8s ease 0.2s; }
      .through .glow { opacity: 1; }
      .through .mark { transform: scale(var(--k, 1)); }

      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes come { to { left: 48px; transform: translate(-50%, -50%) scale(1.7); } }
      @keyframes hide { from { clip-path: inset(-50% -4.5px -50% -50%); } to { clip-path: inset(-50% 48px -50% -50%); } }
      @keyframes swim-in { to { transform: translateX(58px); } }
      @keyframes out { from { opacity: 1; } to { opacity: 0; transform: translateY(-4px); } }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(2px, -3px); } }
      @keyframes wag { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
      @keyframes rise { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 0.9; } 100% { opacity: 0; transform: translate(6px, -22px) scale(1.1); } }
      @media (prefers-reduced-motion: reduce) {
        .swim, .tail, .bubble, .word, .status, .ring i { animation: none !important; }
        .status { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="stage">
      <div class="mark">
        <span class="ring back"><i></i></span>
        <div class="fish-in">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cf8e6" /><stop offset="1" stop-color="#13b89c" /></linearGradient>
            </defs>
            <g class="swim">
              <path class="tail" d="M15 32 L6 23 L6 41 Z" fill="url(#g)" stroke="url(#g)" stroke-width="4" stroke-linejoin="round" />
              <path d="M23 15 L52 32 L23 49 Z" fill="url(#g)" stroke="url(#g)" stroke-width="6" stroke-linejoin="round" />
              <circle cx="38" cy="27.5" r="2.5" fill="#03140f" />
            </g>
            <circle class="bubble" cx="56" cy="26" r="2" />
            <circle class="bubble" cx="58" cy="24" r="1.4" />
            <circle class="bubble" cx="55" cy="27" r="1.7" />
          </svg>
        </div>
        <span class="ring front"><i></i></span>
      </div>
      <div class="below">
        <span class="word" aria-label="Netfish"><span class="net">net</span><span class="fish">fish</span></span>
        <span class="status" id="status">Looking for your server…</span>
      </div>
    </div>
    <script>
      const lang = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      const it = /^it\b/i.test(lang);
      const status = document.getElementById('status');
      if (it) {
        document.documentElement.lang = 'it';
        status.textContent = 'Cerco il tuo server…';
      }
      const SAYS = it
        ? { connecting: 'Fuori casa, mi collego…', connected: 'Connesso tramite WireGuard' }
        : { connecting: 'Away from home, connecting…', connected: 'Connected through WireGuard' };
      // The apps, away from home: 'connecting' (the ring appears, breathing), then 'connected' (the
      // fish swims into it; the apps open Netfish once it's in).
      window.netfishTunnel = (state) => {
        // The opening animation's fish: clamp(92px, 15vw, 148px).
        document.documentElement.style.setProperty('--k', Math.min(148, Math.max(92, innerWidth * 0.15)) / 96);
        document.body.classList.toggle('tunnel', state === 'connecting');
        document.body.classList.toggle('through', state === 'connected');
        // The breath on the clock (the opening animation's ring is too), so it carries on in step.
        if (document.timeline && Element.prototype.getAnimations) {
          for (const ring of document.querySelectorAll('.ring i')) {
            for (const a of ring.getAnimations()) if (a.animationName === 'breathe') a.startTime = document.timeline.currentTime - (Date.now() % 1600);
          }
        }
        if (SAYS[state] && status.textContent !== SAYS[state]) {
          status.textContent = SAYS[state];
          if (status.animate) status.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350, easing: 'ease-out' });
        }
      };
    </script>
  </body>
</html>
